[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "obe-cell-ocr"
version = "0.1.0"
description = "CRNN/CTC recognition of one- and two-digit handwritten marks"
requires-python = ">=3.10"
dependencies = ["torch>=2.2,<3", "Pillow>=10,<13"]

[project.scripts]
cell-ocr = "cell_ocr.cli:main"

[tool.setuptools.packages.find]
include = ["cell_ocr*"]

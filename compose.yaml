services:
  ocr:
    image: obelens-ocr
    platform: linux/amd64
    build:
      context: .
      target: ocr
    restart: unless-stopped
    expose:
      - "8765"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/health', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s

  web:
    image: obelens-web
    platform: linux/amd64
    build:
      context: .
      target: web
    restart: unless-stopped
    depends_on:
      ocr:
        condition: service_healthy
    ports:
      - "127.0.0.1:${OBELENS_PORT:-8080}:80"

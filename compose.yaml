name: obelens

services:
  ocr:
    # Paddle/Flutter's pinned Linux binaries use x86-64. Docker Desktop can
    # emulate this on supported ARM hosts; see the README's hardware notes.
    platform: linux/amd64
    build:
      context: .
      target: ocr
    init: true
    restart: unless-stopped

  web:
    platform: linux/amd64
    build:
      context: .
      target: web
    ports:
      - "127.0.0.1:${OBELENS_PORT:-8080}:80"
    depends_on:
      ocr:
        condition: service_healthy
    restart: unless-stopped

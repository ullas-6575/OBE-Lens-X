name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: subosito/flutter-action@v2.9.1
        with:
          flutter-version: "3.24.0"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test

      - name: Install PostgreSQL
        run: sudo apt-get update && sudo apt-get install --yes postgresql

      - name: Test database migrations and workflow
        run: bash scripts/test_workflow_db.sh

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            os: ubuntu-22.04
            command: flutter build apk --release --no-pub
            artifact: build/app/outputs/flutter-apk/app-release.apk
          - platform: linux
            os: ubuntu-22.04
            command: flutter build linux --release --no-pub
            artifact: build/obelens-linux.tar.gz
          - platform: windows
            os: windows-2022
            command: flutter build windows --release --no-pub
            artifact: build/windows/x64/runner/Release/
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-java@v4.7.1
        if: matrix.platform == 'android'
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2.9.1
        with:
          flutter-version: "3.24.0"
          cache: true

      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install --yes clang cmake ninja-build pkg-config libgtk-3-dev

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build release from this commit
        run: ${{ matrix.command }}

      - name: Package Linux bundle with executable permissions
        if: matrix.platform == 'linux'
        run: tar -czf build/obelens-linux.tar.gz -C build/linux/x64/release bundle

      - name: Upload platform release
        uses: actions/upload-artifact@v4.6.2
        with:
          name: obelens-${{ matrix.platform }}-${{ github.sha }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
